services:
  ociproxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ociproxy
    env_file:
      - ../.env
    environment:
      REGISTRY_STORAGE_S3_ACCESSKEY: ${REGISTRY_STORAGE_S3_ACCESSKEY}
      REGISTRY_STORAGE_S3_SECRETKEY: ${REGISTRY_STORAGE_S3_SECRETKEY}
      REGISTRY_STORAGE_S3_BUCKET: ${REGISTRY_STORAGE_S3_BUCKET}
      REGISTRY_STORAGE_S3_REGION: ${REGISTRY_STORAGE_S3_REGION}
      REGISTRY_STORAGE_S3_ENDPOINT: ${REGISTRY_STORAGE_S3_ENDPOINT}
      REGISTRY_STORAGE_S3_SECURE: ${REGISTRY_STORAGE_S3_SECURE}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: ${REGISTRY_STORAGE_S3_FORCEPATHSTYLE:-true}
      REGISTRY_STORAGE_S3_ROOTDIRECTORY: ${REGISTRY_STORAGE_S3_ROOTDIRECTORY:-/ociproxy}
    command: ["--config", "/etc/ociproxy/config.yaml", "--addr", ":8080"]
    ports:
      - "15000:8080"
    volumes:
      - ./config-dev.yaml:/etc/ociproxy/config.yaml:ro
    restart: unless-stopped

networks:
  default:
    driver: bridge

