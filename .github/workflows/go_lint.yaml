name: Go Lint

on:
  push:
    branches:
      - "**"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/go_lint.yaml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/go_lint.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        run: echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Install golangci-lint
        run: bash scripts/setup-linter.sh

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        run: echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...
