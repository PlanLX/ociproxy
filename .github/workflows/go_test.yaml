name: Go Test

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        run: echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...
